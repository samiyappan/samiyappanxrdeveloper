<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment with Google Pay UPI Link</title>
  <style>
    #paymentSection, #successSection {
      margin: 20px;
      padding: 20px;
      border: 1px solid #ddd;
    }
    #successSection {
      display: none; /* Hidden until payment is successful */
    }
    .upi-link {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #4285F4;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Payment Section -->
  <div id="paymentSection">
    <h2>Make Your Payment</h2>
    <!-- This button simulates starting your payment process -->
    <button onclick="processPayment()">Pay Now</button>
  </div>

  <!-- Success Section -->
  <div id="successSection">
    <h2>Payment Successful!</h2>
    <p>Thank you for your payment. Click the link below to complete the payment using Google Pay UPI:</p>
    <!-- Google Pay UPI link example -->
    <a class="upi-link" href="upi://pay?pa=merchantid@upi&pn=MerchantName&tr=TXN12345&am=10.00&cu=INR" target="_blank">
      Pay via Google Pay
    </a>
  </div>

  <script>
    // Function to simulate a payment process. Replace this with actual payment integration.
    function processPayment() {
      // Simulate a processing delay (replace with actual payment API call)
      setTimeout(function() {
        paymentSuccess();
      }, 1000); // Simulated delay of 1 second
    }

    // Function to handle successful payment
    function paymentSuccess() {
      document.getElementById('paymentSection').style.display = 'none';
      document.getElementById('successSection').style.display = 'block';
    }
  </script>

</body>
</html>
